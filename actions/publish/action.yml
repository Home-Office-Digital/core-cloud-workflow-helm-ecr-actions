name: "Helm publish to ECR"
description: "Optionally validate tag, ensure repo exists, push chart to ECR"
inputs:
  registry:
    description: "ECR registry host (from the login action)"
    required: true
  package_path:
    description: "Path to the packaged .tgz (from the package action)"
    required: true
  chart_name:
    description: "Chart name (from the package action)"
    required: true
  chart_version:
    description: "Chart version (from the package action)"
    required: true
  chart_directory:
    description: "Chart directory - used only for tag-format detection"
    required: false
    default: "."
  aws_region:
    description: "AWS region of the ECR registry"
    required: false
    default: "eu-west-2"
  create_repository:
    description: "Create the ECR repo if missing (needs ecr:CreateRepository)"
    required: false
    default: "false"
  validate_version_tag:
    description: "Assert the git tag matches chart_version"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Validate chart version matches git tag
      if: ${{ inputs.validate_version_tag == 'true' }}
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
        CHART_VERSION: ${{ inputs.chart_version }}
      run: |
        set -euo pipefail
        if [[ "${{ inputs.chart_directory }}" == "." ]]; then
          EXPECTED="${TAG}"
        else
          EXPECTED="${TAG#*/}"
        fi
        if [[ "${EXPECTED}" != "v${CHART_VERSION}" ]]; then
          echo "Error: git tag [${TAG}] does not match Chart.yaml version [${CHART_VERSION}]"; exit 1
        fi
    - name: Ensure ECR repository exists
      if: ${{ inputs.create_repository == 'true' }}
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws_region }}
        CHART_NAME: ${{ inputs.chart_name }}
      run: |
        set -euo pipefail
        aws ecr describe-repositories --region "${AWS_REGION}" --repository-names "${CHART_NAME}" >/dev/null 2>&1 \
          || aws ecr create-repository --region "${AWS_REGION}" --repository-name "${CHART_NAME}" >/dev/null
    - name: Push chart to ECR
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        PACKAGE_PATH: ${{ inputs.package_path }}
      run: |
        set -euo pipefail
        helm push "${PACKAGE_PATH}" "oci://${REGISTRY}"